name: Build

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make PROJECT=SC51COMS1EZH1 clean preload root-helper
      - uses: actions/upload-artifact@v7
        with:
          name: SC51COMS1EZH1
          path: build/SC51COMS1EZH1/bin/
